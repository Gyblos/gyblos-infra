name: Relay monitor

on:
  # Manual while runner quota is unavailable.
  workflow_dispatch:
    inputs:
      authenticated_e2e:
        description: Run authenticated E2E (requires deployment token)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: relay-monitor-na1
  cancel-in-progress: true

env:
  RELAY_URL: https://na1.relay.gyblos.com
  RELAY_PROBE_STATUS: '404'

jobs:
  public-health:
    name: Public health (does not certify E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check public endpoints and certificate
        run: node relay/check/public-health.mjs
      - name: Record coverage
        if: always()
        env:
          REQUESTED_E2E: ${{ inputs.authenticated_e2e }}
        run: |
          echo "Public checks result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REQUESTED_E2E" != true ]; then
            echo 'Public-only run: authenticated E2E NOT REQUESTED; full validation incomplete.' >> "$GITHUB_STEP_SUMMARY"
          fi

  authenticated-e2e:
    name: Authenticated relay E2E
    needs: public-health
    if: inputs.authenticated_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require deployment token
        env:
          GYBLOS_RELAY_TOKEN: ${{ secrets.GYBLOS_RELAY_TOKEN }}
        run: |
          if [ -z "${GYBLOS_RELAY_TOKEN:-}" ]; then
            echo '::error::Authenticated E2E requested but GYBLOS_RELAY_TOKEN is missing.'
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/check/package-lock.json
      - name: Install relay check dependencies
        working-directory: relay/check
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run authenticated relay E2E
        working-directory: relay/check
        env:
          GYBLOS_RELAY_TOKEN: ${{ secrets.GYBLOS_RELAY_TOKEN }}
        run: node check.mjs
      - name: Record authenticated result
        if: always()
        run: |
          echo "Authenticated E2E result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
